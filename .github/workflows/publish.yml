name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# OIDC trusted publishing: GitHub verifies the workflow's identity to npm, so
# no NPM_TOKEN secret is required (and none is referenced below).
#
# The 'npm' environment makes the OIDC subject ref-agnostic; without it a tag
# push mints a per-tag subject npm cannot match for future versions.
#
# One-time setup (web): https://www.npmjs.com/package/rebuild-dossier/access
#   Publish with a Trusted Publisher -> GitHub Actions -> repo
#   Parker-Fawcett/rebuild-dossier, workflow publish.yml, environment npm
permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      - run: npm run build

      - run: npm publish --access public
