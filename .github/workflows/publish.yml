name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# OIDC trusted publishing: GitHub verifies the workflow's identity to npm, so
# no NPM_TOKEN secret is required (and none is referenced below).
#
# One-time setup (web, after the package exists):
#   https://www.npmjs.com/package/rebuild-dossier/access  ->  Publish with a Trusted
#   Publisher  ->  GitHub Actions  ->  repo Parker-Fawcett/rebuild-dossier, workflow publish.yml
permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: Debug OIDC subject (temp)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm" | python3 -c "import sys,json;print(json.load(sys.stdin).get('value',''))")
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | python3 -c "import sys,base64;sys.stdout.buffer.write(base64.urlsafe_b64decode(sys.argv[1]+'==='))" "$(echo "$TOKEN" | cut -d. -f2)" 2>/dev/null | python3 -c "import sys,json;print('OIDC_SUB='+json.load(sys.stdin).get('sub','NO_SUB'))"

      - run: npm ci

      - run: npm run build

      - run: npm publish --access public
