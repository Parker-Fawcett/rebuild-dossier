name: Publish to Official MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: npm install -g @modelcontextprotocol/publisher 2>/dev/null || npm install -g mcp-publisher 2>/dev/null || echo "Assuming mcp-publisher is pre-installed or available in env"

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Login (DNS auth)
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}
        run: |
          mcp-publisher login dns --domain parkerfawcett.com --private-key "$MCP_PRIVATE_KEY"

      - name: Publish to registry
        run: mcp-publisher publish
