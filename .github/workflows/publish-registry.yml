name: Publish to Official MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The official publisher is a Go binary released from
      # modelcontextprotocol/registry, not an npm package. This step used to
      # `npm install -g mcp-publisher`, which installs an unrelated third-party
      # package of that name; every step then "succeeded" without publishing,
      # so the registry stayed at 0.2.6 through 0.2.15. Pinned and checksummed.
      - name: Install mcp-publisher (official, pinned)
        env:
          VERSION: v1.8.1
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Validate server.json
        run: mcp-publisher validate

      - name: Login (DNS auth)
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_DNS_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "::error::MCP_DNS_PRIVATE_KEY secret is not set; refusing to report a publish that cannot happen."
            exit 1
          fi
          mcp-publisher login dns --domain parkerfawcett.com --private-key "$MCP_PRIVATE_KEY"

      - name: Publish to registry
        run: mcp-publisher publish

      - name: Verify the registry now lists this version
        run: |
          VERSION=$(node -p "require('./server.json').version")
          NAME=$(node -p "require('./server.json').name")
          ENC=$(node -p "encodeURIComponent('$NAME')")
          curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers/${ENC}/versions" | grep -q "\"version\":\"${VERSION}\"" \
            || { echo "::error::registry does not list ${NAME}@${VERSION} after publish"; exit 1; }
